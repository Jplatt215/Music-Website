{% extends "base.html" %}

{% block title %}Music Index{% endblock %}

{% block content %}
<head>
  <link rel="stylesheet" href="{{ url_for('static', filename='composer.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='global.css') }}">
  <script src="https://cdn.jsdelivr.net/npm/tone@14.8.39/build/Tone.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/vexflow@4.2.2/build/cjs/vexflow.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tonejs/midi"></script>
  <script src="{{ url_for('static', filename='js/auth.js') }}" defer></script>
  <script src="{{ url_for('static', filename='js/composer.js') }}" defer></script>
  <script src="{{ url_for('static', filename='js/saveload.js') }}" defer></script>

<title>Automated Composition</title>
</head>
<body>

  <div class="navbar-main">
    <a class="nav-item nav-link" id="index" href="/index">Music Index</a>
    <a class="nav-item nav-link" id="scales" href="/scales">Scale Calculator</a>
    <a class="nav-item nav-link" id="composer" href="/composer">Automated Composition</a>

    <!-- Auth section -->
    <div class="nav-auth">
      <!-- Shown when logged out -->
      <button class="nav-btn" id="loginBtn">Login</button>

      <!-- Shown when logged in -->
      <div class="nav-user hidden" id="navUser">
        <button class="nav-btn" id="userMenuBtn">
          <span id="navUsername"></span> ▾
        </button>
        <div class="nav-dropdown hidden" id="userDropdown">
          <hr class="dropdown-divider">
          <button class="dropdown-item" id="logoutBtn">Log Out</button>
        </div>
      </div>
    </div>
  </div>

<!-- Auth Modal -->
<div class="auth-overlay hidden" id="authModal">
  <div class="auth-box">
    <button class="auth-close" id="authModalClose">✕</button>

    <div class="auth-tabs">
  <button class="auth-tab active" data-tab-target="loginForm">Login</button>
  <button class="auth-tab" data-tab-target="registerForm">Register</button>
</div>

    <div id="loginForm" class="auth-form">
  <input type="email" id="loginEmail" placeholder="Email" class="auth-input" autocomplete="off" />
  <input type="password" id="loginPassword" placeholder="Password" class="auth-input" autocomplete="new-password" />
  <p class="auth-error hidden" id="loginError"></p>
  <button class="auth-submit" id="loginSubmit">Login</button>
</div>

<div id="registerForm" class="auth-form hidden">
  <input type="text" id="registerUsername" placeholder="Username" class="auth-input" autocomplete="off" />
  <input type="email" id="registerEmail" placeholder="Email" class="auth-input" autocomplete="off" />
  <input type="password" id="registerPassword" placeholder="Password" class="auth-input" autocomplete="new-password" />
  <p class="auth-error hidden" id="registerError"></p>
  <button class="auth-submit" id="registerSubmit">Register</button>
</div>
  </div>
</div>

  <!-- Top bar: project title (static) + tempo + play. Always visible, regardless of tab. -->
  <div class="topBarRow">
  <div class="topBarLeft">
  <div class="topBarLeft" id="projectTitleBtn" role="button" tabindex="0">
    <span id="currentCompositionTitle" class="projectTitle">Untitled</span>
  </div>
</div>
  <div class="topBarRight">
    <div class="selectControls">
      <button class="previousButton">←</button>
      <button class="nextButton">→</button>
    </div>
    <button class="playButton">⏵</button>
    <button id="bpmDisplay">Tempo: <span id="bpmValue">120</span> BPM
      <input type="range" id="bpmSlider" min="30" max="180" value="120" />
    </button>
  </div>
</div>

  <div class="header">
    <div class="menu">
      <!-- Tabs -->
      <div class="tabs">
        <button class="tab-btn active" data-target="input-menu" id="createTabBtn">Create</button>
        <button class="tab-btn" data-target="edit-menu" id="editTabBtn">Edit</button>
        <button class="tab-btn hidden" data-target="load-menu" id="loadTabBtn">Load</button>
      </div>

      <!-- Create tab -->
      <div id="input-menu" class="tab-content">
        <div class="buttonDescription">Generate</div>
        <div class="row">
          <div style="flex: 1;">
            <button class="generatePhraseButton" style="width: 100%;">Phrase</button>
          </div>
        </div>

        <div class="buttonDescription">Accompany</div>
        <div class="row">
          <div style="flex: 1;">
            <button class="separateVoiceButton" style="width: 100%;">Separate</button>
          </div>
        </div>

        <div class="buttonDescription">Modify</div>
        <div class="row" style="gap: 0;"> 
          <div style="flex: 1;">
            <button class="reverseButton" style="width: 100%;">Reverse</button>
          </div>
          <!-- Reflect -->
          <div style="flex: 1; position: relative; overflow: visible;">
            <button class="reflectButton" style="width: 100%;">Reflect</button>
            <select id="reflectSelect" size="8" style="display:none; position: absolute; top: 100%; left: 0; width: 100%; z-index: 9999;">
              <option value="A">A</option>
              <option value="Bb">Bb</option>
              <option value="B" selected>B</option>
              <option value="C">C</option>
              <option value="Db">Db</option>
              <option value="D">D</option>
              <option value="Eb">Eb</option>
              <option value="E">E</option>
              <option value="F">F</option>
              <option value="Gb">Gb</option>
              <option value="G">G</option>
              <option value="Ab">Ab</option>
            </select>
          </div>
        </div>

        <div class="row" style="gap: 0;"> 
          <!-- Shift -->
          <div style="flex: 1; position: relative; overflow: visible;">
            <button class="shiftButton" style="width: 100%;">Shift</button>
            <select id="shiftSelect" size="8" style="display:none; position: absolute; top: 100%; left: 0; width: 100%; z-index: 9999;">
              <option value="w">𝅝</option>
              <option value="hd" selected>𝅗𝅥.</option>
              <option value="h">𝅗𝅥</option>
              <option value="qd">𝅘𝅥.</option>
              <option value="q">𝅘𝅥</option>
              <option value="8d">𝅘𝅥𝅮.</option>
              <option value="8">𝅘𝅥𝅮</option>
              <option value="16d">𝅘𝅥𝅯.</option>
              <option value="16">𝅘𝅥𝅯</option>
              <option value="32">𝅘𝅥𝅰</option>
            </select>
          </div>
          <!-- Transpose -->
          <div style="flex: 1; position: relative; overflow: visible;">
            <button class="transposeButton" id="transposeButton" style="width: 100%;">Transpose</button>
            <select id="transposeDropdown" size="8" style="display:none; position: absolute; top: 100%; left: 0; width: 100%; z-index: 9999;">
            </select>
          </div>
        </div>

        <div class="row">
          <div style="flex: 1;"><button class="shuffleRhythmButton" style="width: 100%;">Shuffle Rhythm</button></div>
          <div style="flex: 1;"><button class="shuffleNotesButton" style="width: 100%;">Shuffle Notes</button></div>
          <div style="flex: 1;"><button class="shufflePitchButton" style="width: 100%;">Shuffle Pitch</button></div>
        </div>

        <div class="row">
          <div style="flex: 1;"><button class="changeRhythmButton" style="width: 100%;">Change Rhythm</button></div>
          <div style="flex: 1;"><button class="changePitchButton" style="width: 100%;">Change Pitch</button></div>
        </div>

        <div class="buttonDescription">Develop</div>
        <div class="row">
          <div style="flex: 1;"><button class="simplifyButton" style="width: 100%;">Simplify</button></div>
          <div style="flex: 1;"><button class="complicateButton" style="width: 100%;">Complicate</button></div>
        </div>
      </div>

      <!-- Edit tab: placeholder for now -->
      <div id="edit-menu" class="tab-content hidden">

      </div>

      <!-- Load tab -->
      <div id="load-menu" class="tab-content hidden">
        <div id="notLoggedInMsg" class="buttonDescription">
          Log in to save and load compositions
        </div>
        <div id="loggedInLoad" class="hidden">

          <div class="row">
            <button class="saveButton" style="width: 100%;">💾 Save</button>
          </div>

          <!-- Load bank -->
          <div class="buttonDescription">Compositions</div>
          <div id="compositionList" style="
            max-height: 200px;
            overflow-y: auto;
            border: 1px solid #575757;
            background: white;
          "></div>

          <!-- Bottom actions -->
           <div class="buttonDescription">File</div>
          <div class="row">
            <button class="newCompositionButton" style="flex: 1;">+ New</button>
            <button class="deleteCompositionButton" style="flex: 1; color: red;">🗑 Delete</button>
          </div>

        </div>
      </div>
    </div>


    <!-- Output -->
<div class="output-container">
  <div id="voiceScrollWrapper">
  <div id="measureBarWrapper">
    <div id="layerTabs">
      <button class="layer-toggle" id="layerToggle">Main</button>
    </div>
    <div id="measureBar"></div>
  </div>
  <div id="output">
    <div id="output"></div>
</div>

<template id="voiceTemplate">
  <div class="voiceWrapper">
    <div class="voiceSettings">
      <div class="row">
        <select class="rootSelect">
          <option value="A">A</option>
          <option value="Bb">Bb</option>
          <option value="B">B</option>
          <option value="C" selected>C</option>
          <option value="Db">Db</option>
          <option value="D">D</option>
          <option value="Eb">Eb</option>
          <option value="E">E</option>
          <option value="F">F</option>
          <option value="Gb">Gb</option>
          <option value="G">G</option>
          <option value="Ab">Ab</option>
        </select>
        <div class="row">
          <select class="scaleSelect"></select>
        </div>
      </div>
      <div class="row">
        <button class="harmonizeButton">Harmonize</button>
      </div>
      <div class="row">
        <select class="minPitch"></select> - <select class="maxPitch"></select>
      </div>
      <div class="row">
        <select class="minRhythm"></select> - <select class="maxRhythm"></select>
      </div>
      <select class="instrumentSelect">
        <option value="Winds">Winds</option>
        <option value="Brass">Brass</option>
        <option value="Piano" selected>Piano</option>
        <option value="Strings">Strings</option>
      </select>
      <div class="row">
        <button class="muteButton">Mute</button>
      </div>
      <div style="height:100px;"></div>
      <div class="row">
        <button class="midiButton">MIDI</button>
        <button class="musicXMLButton">MusicXML</button>
      </div>
    </div>
    <div class="voiceContainer"></div>
  </div>
</template>

  </div>
</body>
{% endblock %}
